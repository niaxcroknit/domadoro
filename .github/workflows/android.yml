name: Android build

on:
  push:
    branches: [main, 'update/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: domadoro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domadoro-screens
          path: app/build/screens/*.png
      # 화면 그림을 ci-screens 브랜치에도 올려서 git으로 받아 볼 수 있게 해요.
      - name: Publish screenshots to ci-screens branch
        if: always() && github.event_name == 'push'
        run: |
          if ls app/build/screens/*.png >/dev/null 2>&1; then
            mkdir -p /tmp/shots && cp app/build/screens/*.png /tmp/shots/
            cd /tmp/shots
            git init -q && git checkout -q -b ci-screens
            git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screens ${GITHUB_SHA}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
          fi
